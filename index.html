<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lidera Social</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231D3573'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23C4A974' stroke-width='5'/%3E%3Ccircle cx='46' cy='18' r='4.5' fill='%23C4A974'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#1D3573;--navy-2:#15295C;--navy-3:#0F1B36;--gold:#A48A57;--gold-2:#C4A974;--gold-soft:rgba(164,138,87,.14);
  --bg:#F3F4F7;--panel:#FFFFFF;--panel-2:#F8F9FB;--line:#E6E8EE;--line-2:#D7DBE5;--txt:#111827;--txt-2:#4B5565;--mut:#7B8494;
  --ok:#1F8A5B;--ok-soft:rgba(31,138,91,.12);--warn:#C47A14;--warn-soft:rgba(196,122,20,.14);--bad:#C2413B;--bad-soft:rgba(194,65,59,.12);--hot:#E4573F;--info:#2F6FDB;--info-soft:rgba(47,111,219,.12);
  --r:12px;--r-lg:16px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh-2:0 8px 24px rgba(16,24,40,.10);
  --side:248px;--top:56px;--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1120;--panel:#131B2E;--panel-2:#0F172A;--line:#1F2A44;--line-2:#2A3756;--txt:#EEF2FA;--txt-2:#B6BFD2;--mut:#7F8AA3;--sh:0 1px 2px rgba(0,0,0,.4);--sh-2:0 12px 32px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#0B1120;--panel:#131B2E;--panel-2:#0F172A;--line:#1F2A44;--line-2:#2A3756;--txt:#EEF2FA;--txt-2:#B6BFD2;--mut:#7F8AA3;--sh:0 1px 2px rgba(0,0,0,.4);--sh-2:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
@media(min-width:720px){input,select,textarea{font-size:14px}}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,53,115,.14)}
:root[data-theme=dark] input:focus,:root:not([data-theme=light]) input:focus{box-shadow:0 0 0 3px rgba(196,169,116,.18);border-color:var(--gold)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;letter-spacing:.02em}
.hide{display:none!important}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;line-height:1;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy-2)}
.btn-g{background:var(--gold);color:#fff}.btn-g:hover{background:#8f7849}
.btn-s{background:var(--panel);border-color:var(--line-2);color:var(--txt)}.btn-s:hover{background:var(--panel-2)}
.btn-q{color:var(--txt-2)}.btn-q:hover{background:var(--panel-2);color:var(--txt)}
.btn-d{color:var(--bad)}.btn-d:hover{background:var(--bad-soft)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}.btn-sm svg{width:14px;height:14px}
.btn-ic{padding:8px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
/* login */
#login{min-height:100%;display:grid;grid-template-columns:1fr;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,#22407f 0%,var(--navy-3) 55%,#070C18 100%)}
#login .box{background:var(--panel);border-radius:22px;padding:36px 32px;width:min(400px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none}
.brand i:after{content:"";width:12px;height:12px;border:3px solid var(--gold-2);border-radius:50%}
.brand small{color:var(--gold);font-weight:600}
/* shell */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:var(--navy-3);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
aside .brand{padding:6px 8px 14px;color:#fff}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.acct:hover{background:rgba(255,255,255,.1)}
.acct .av{width:34px;height:34px}
.acct .n{font-weight:700;font-size:13.5px;line-height:1.2}.acct .s{font-size:11.5px;color:rgba(255,255,255,.6)}
.acct svg{margin-left:auto;width:16px;height:16px;opacity:.7}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:12px 10px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:rgba(255,255,255,.75);font-weight:500;font-size:13.5px;transition:.12s}
.nav a svg{width:18px;height:18px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(196,169,116,.16);color:#fff}.nav a.on svg{color:var(--gold-2);opacity:1}
.nav .badge{margin-left:auto;background:var(--hot);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
.nav .kbd{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:0 5px}
aside .foot{margin-top:auto;display:flex;gap:6px;align-items:center;padding:8px 4px 0;color:rgba(255,255,255,.6);font-size:12px}
aside .foot .btn{color:rgba(255,255,255,.75)}aside .foot .btn:hover{background:rgba(255,255,255,.08);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
.topbar h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.topbar .sub{color:var(--mut);font-size:12.5px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--mut);font-size:13px;cursor:pointer;min-width:220px}
.search svg{width:15px;height:15px}.search kbd{margin-left:auto;font:11px var(--font);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--mut)}
.content{padding:20px;max-width:1280px;width:100%;margin:0 auto;flex:1}
/* bottom nav (mobile) */
.bnav{display:none}
@media(max-width:899px){
  .shell{grid-template-columns:1fr}aside{display:none}
  .topbar{padding:0 14px;padding-top:env(safe-area-inset-top);height:calc(var(--top) + env(safe-area-inset-top))}
  .topbar .search{display:none}
  .content{padding:14px 14px calc(86px + env(safe-area-inset-bottom))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);font-weight:600;padding:4px 0;position:relative;border-radius:10px}
  .bnav a svg{width:22px;height:22px}.bnav a.on{color:var(--navy)}
  :root[data-theme=dark] .bnav a.on,:root:not([data-theme=light]) .bnav a.on{color:var(--gold-2)}
  .bnav .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--hot);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
}
/* cards & bits */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.card.pad-0{padding:0;overflow:hidden}.card + .card{margin-top:12px}
.card h3{margin:0 0 4px;font-size:14.5px;font-weight:700}.card .desc{color:var(--mut);font-size:12.5px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hd h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.02em}.hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{margin-left:auto}.col{display:flex;flex-direction:column;gap:6px}
.mut{color:var(--mut)}.t2{color:var(--txt-2)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:700}.sb{font-weight:600}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:899px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2m1{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.1}
.kpi .d{font-size:12px;margin-top:4px;color:var(--mut)}.kpi .d.up{color:var(--ok)}.kpi .d.down{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel-2);color:var(--txt-2);border:1px solid var(--line);white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}.pill.hot{background:var(--bad-soft);color:var(--hot);border-color:transparent}.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#2f55b0);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:56px;height:56px;font-size:20px}.av.sm{width:28px;height:28px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hot);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--txt-2);transition:.12s}.chip:hover{border-color:var(--navy)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs2{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}.tabs2 button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--mut)}.tabs2 button.on{background:var(--panel);color:var(--txt);box-shadow:var(--sh)}
.list .it{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;transition:background .12s}.list .it:hover{background:var(--panel-2)}.list .it.on{background:var(--gold-soft)}.list .it:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}tr:last-child td{border:0}tbody tr:hover{background:var(--panel-2)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .4s}
.empty{text-align:center;color:var(--mut);padding:36px 16px}.empty svg{width:36px;height:36px;opacity:.4;margin-bottom:8px}
.ring{width:64px;height:64px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
/* actions */
.acao{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-left:3px solid var(--line-2);background:var(--panel);border-radius:0 var(--r) var(--r) 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
.acao.b1,.acao.b6{border-left-color:var(--gold)}.acao.b2{border-left-color:var(--hot)}.acao.b3{border-left-color:var(--navy)}.acao.b4{border-left-color:var(--info)}.acao.b5{border-left-color:var(--warn)}.acao.b7{border-left-color:#7B61B8}.acao.b8{border-left-color:#2A9D8F}.acao.b9{border-left-color:var(--mut)}
.acao.feita{opacity:.5}.acao .txt{white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0 6px;line-height:1.5}
.acao .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;cursor:pointer;margin-top:1px}.acao .chk:hover{border-color:var(--ok)}.acao.feita .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.bloco-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}.bloco-h .n{color:var(--txt-2);font-weight:600;text-transform:none;letter-spacing:0}
.focus{background:linear-gradient(135deg,var(--navy),#2b4a9a);color:#fff;border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-2)}
.focus .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:700}.focus .t{font-size:17px;font-weight:800;margin:4px 0 6px}.focus .txt{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px;margin:8px 0}
.focus .btn-s{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
/* inbox */
.inbox{display:grid;grid-template-columns:320px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;height:calc(100vh - var(--top) - 40px);min-height:520px}
.inbox.three{grid-template-columns:320px 1fr 300px}
.inbox .pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.inbox .pane:last-child{border-right:0}
.inbox .ph{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inbox .scroll{overflow:auto;flex:1;min-height:0}
.thread{display:flex;flex-direction:column;gap:6px;padding:14px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);line-height:1.45}.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-color:transparent}.msg .t{display:block;font-size:10.5px;opacity:.55;margin-top:4px}
.composer{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
.composer textarea{min-height:76px;border-radius:12px}
.iabox{background:var(--gold-soft);border:1px solid rgba(164,138,87,.3);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 12px 8px;line-height:1.5}
@media(max-width:899px){.inbox,.inbox.three{grid-template-columns:1fr;height:auto;min-height:0;border:0;background:transparent}.inbox .pane{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}.inbox .pane.hidem{display:none}}
/* kanban */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.kcol{flex:0 0 250px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;scroll-snap-align:start;min-height:200px}
.kcol h4{margin:4px 6px 8px;font-size:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-2)}.kcol h4 .n{margin-left:auto;color:var(--mut);font-weight:600}
.kcol.over{outline:2px dashed var(--gold);outline-offset:-2px}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:grab;font-size:13px;box-shadow:var(--sh)}.lead:active{cursor:grabbing}.lead .m{font-size:11.5px;color:var(--mut);margin-top:3px}
/* posts */
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.post:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.post img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--panel-2)}.post .m{padding:8px 10px;font-size:11.5px;color:var(--mut);line-height:1.4}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .dh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;text-align:center;font-weight:700;padding:4px 0}
.cal .d{min-width:0;overflow:hidden;min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;cursor:pointer}.cal .d:hover{border-color:var(--gold)}.cal .d.today{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}.cal .d.off{opacity:.45}
.cal .d .n{font-weight:700;color:var(--txt-2);margin-bottom:4px}.cal .ev{font-size:11px;padding:3px 6px;border-radius:6px;margin-top:3px;background:var(--panel-2);border-left:3px solid var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.dor{border-left-color:var(--hot)}.ev.bastidor{border-left-color:#7B61B8}.ev.ensino{border-left-color:var(--info)}.ev.convite{border-left-color:var(--gold)}.ev.resultado{border-left-color:var(--ok)}.ev.captura{border-left-color:var(--warn)}
.ev.publicado{opacity:.6;text-decoration:line-through}
@media(max-width:720px){.cal{grid-template-columns:repeat(7,1fr);gap:3px}.cal .d{min-height:54px;padding:3px}.cal .ev{display:none}.cal .d .cnt{font-size:10px;color:var(--gold);font-weight:700}}
/* sheets, palette, toast */
.sheet{position:fixed;inset:0;background:rgba(7,12,24,.55);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-end;justify-content:center}.sheet.on{display:flex}
.sheet .in{background:var(--panel);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh-2)}
.sheet .in.wide{max-width:960px}
@media(min-width:720px){.sheet{align-items:center;padding:20px}.sheet .in{border-radius:18px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sheet-h h2{font-size:17px;margin:0;font-weight:800}
.pal{position:fixed;inset:0;z-index:70;background:rgba(7,12,24,.5);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}.pal.on{display:flex}
.pal .box{width:min(640px,calc(100% - 24px));background:var(--panel);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden;border:1px solid var(--line)}
.pal input{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;box-shadow:none!important}
.pal .res{max-height:50vh;overflow:auto}.pal .r{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;font-size:14px}.pal .r:hover,.pal .r.on{background:var(--gold-soft)}.pal .r .k{margin-left:auto;font-size:11px;color:var(--mut)}.pal .r svg{width:16px;height:16px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--txt);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:99;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--sh-2);max-width:calc(100% - 32px)}.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:899px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(128,128,128,.35);border-top-color:currentColor;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}
svg.chart{width:100%;height:140px;display:block}
.menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);padding:6px;z-index:50;color:var(--txt)}
.menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}.menu .mi:hover{background:var(--panel-2)}.menu .mi.on{background:var(--gold-soft)}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel-2);cursor:pointer}.tpl:hover{border-color:var(--gold)}.tpl .t{font-weight:700;font-size:12.5px;margin-bottom:3px}.tpl .x{font-size:12.5px;color:var(--txt-2);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ideia{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.ideia .g{font-weight:700;font-size:14px;margin:4px 0}
.print-hide{}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="brand"><i></i>Lidera <small>Social</small></div>
    <p class="t2 sm" style="margin:8px 0 20px">Instagram da Lidera em um lugar só: direct, comentários, leads, métricas, conteúdo e a rotina de social selling.</p>
    <label>E-mail</label><input id="lemail" type="email" autocomplete="username" inputmode="email">
    <label>Senha</label><input id="lpass" type="password" autocomplete="current-password">
    <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:18px;padding:12px" onclick="login()">Entrar</button>
    <p id="lerr" class="sm" style="color:var(--bad);min-height:20px;margin:10px 0 0"></p>
  </div>
</div>

<div id="app">
<div class="shell">
  <aside>
    <div class="brand"><i></i>Lidera <small>Social</small></div>
    <div class="acct" id="acctBtn" onclick="menuContas(event)" style="position:relative"></div>
    <nav class="nav" id="snav"></nav>
    <div class="foot"><button class="btn btn-q btn-sm" onclick="toggleTema()" title="Tema">◐</button><button class="btn btn-q btn-sm" onclick="sync()" id="btnSync" title="Sincronizar">↻ Sync</button><span class="right xs" id="userLbl"></span></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="acct" id="acctBtnM" onclick="menuContas(event)" style="position:relative;padding:4px 8px;background:transparent;border:0"></div>
      <div class="grow"><h1 id="ttl">Hoje</h1><div class="sub" id="ttlSub"></div></div>
      <div class="search" onclick="abrirPal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar leads, conversas, ações…<kbd>⌘K</kbd></div>
      <button class="btn btn-q btn-ic" onclick="abrirPal()" title="Buscar" id="palM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="btn btn-q btn-ic" onclick="sync()" id="btnSyncM" title="Sincronizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <main class="content" id="main"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)fecharSheet()"><div class="in" id="sheetIn"></div></div>
<div class="pal" id="pal" onclick="if(event.target===this)fecharPal()"><div class="box"><input id="palIn" placeholder="Digite para buscar ou executar… (ex.: @nome, 'direct', 'novo lead')" oninput="palBusca()" onkeydown="palKey(event)"><div class="res" id="palRes"></div></div></div>
<div class="toast" id="toast"></div>
<script>
// ===================== núcleo =====================
const SUPA_URL='https://fvcbxorfstqqeewocxkf.supabase.co';
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2Y2J4b3Jmc3RxcWVld29jeGtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzM5MjgsImV4cCI6MjA5Njg0OTkyOH0.X9gnZt535F1ASHpUaL24eEZysHHECwzfBwjaR4kVnyw';
const FN=SUPA_URL+'/functions/v1';
const sb=supabase.createClient(SUPA_URL,SUPA_ANON);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'–':Number(n).toLocaleString('pt-BR');
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
const dtBR=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const dBR=d=>d?new Date(d.length===10?d+'T12:00:00':d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'';
const hoje=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
const somaDias=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
const rel=d=>{if(!d)return '';const m=(Date.now()-new Date(d))/6e4;if(m<1)return 'agora';if(m<60)return Math.round(m)+' min';if(m<1440)return Math.round(m/60)+' h';return Math.round(m/1440)+' d'};
const ETAPAS={novo:'Novo',aquecendo:'Aquecendo',ativado:'Ativado, sem resposta',rmv:'Em conversa (RMV)',desafio:'Desafio nomeado',escada:'Escada concluída',convite:'Convite feito',agendado_charles:'Agendado, Charles',agendado_guilherme:'Agendado, Guilherme',compareceu:'Compareceu',noshow:'No-show',frio:'Frio, reciclar',fora_icp:'Fora de ICP'};
const FLUXOS={SC:'Story de captura',RS:'Reação em story',CP:'Comentário/curtida',NS:'Novo seguidor',VS:'Visita sincera',OB:'Outbound'};
const FAIXAS={ate100:'Até 100 mil','100a300':'100 a 300 mil','300a500':'300 a 500 mil',acima500:'Acima de 500 mil'};
const BLOCOS={1:['08:30','Story de captura'],2:['08:40','Inbound: story, comentário e direct'],3:['09:30','Avançar conversas abertas'],4:['10:30','Novos seguidores: triagem e ativação'],5:['11:15','Follow-ups D+2, D+5, D+10'],6:['14:00','Segundo story + plantão'],7:['14:30','Visita sincera na base parada'],8:['15:30','Outbound: aquecimento e ativação'],9:['16:30','Registro e fechamento']};
const CATS={dor:'Dor',bastidor:'Bastidor',ensino:'Ensino',convite:'Convite',resultado:'Resultado',captura:'Captura',outro:'Outro'};
const METAS={resposta:{SC:[60,75],RS:[45,60],CP:[45,60],NS:[25,35],VS:[25,35],OB:[10,15]},rmv_desafio:50,desafio_escada:60,escada_convite:55,agendado_compareceu:70,diag_mes:[25,40]};
const IC={hoje:'<path d="M8 2v3M16 2v3M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="m9 15 2 2 4-4"/>',inbox:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',coment:'<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',leads:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',metricas:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',conteudo:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',criar:'<path d="M12 3v18M3 12h18"/>',planner:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',playbook:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',contas:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/>',ig:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/>',check:'<path d="m5 12 5 5L20 7"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',spark:'<path d="m12 3 1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/>',ext:'<path d="M15 3h6v6M10 14 21 3M21 14v7H3V3h7"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',more:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',sync:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m9 18 6-6-6-6"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>',bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',story:'<circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',edit:'<path d="M12 20h9"/><path d="m16.5 3.5 4 4L7 21H3v-4z"/>',down:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m18 15-6-6-6 6"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',film:'<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/>',layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',flag:'<path d="M4 22V4a2 2 0 0 1 2-2h12l-3 5 3 5H6"/>'};
const ic=(n,s=18)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="${s}" height="${s}">${IC[n]||''}</svg>`;
const TELAS=[['hoje','Hoje','hoje','1'],['inbox','Direct','inbox','2'],['coment','Comentários','coment','3'],['leads','Leads','leads','4'],['metricas','Métricas','metricas','5'],['conteudo','Conteúdo','conteudo','6'],['planner','Planejador','planner','7'],['criar','Criar com IA','criar','8'],['playbook','Playbook','playbook','9'],['contas','Contas','contas','0']];
let S={user:null,contas:[],conta:null,aba:'hoje',cache:{},badges:{}};

function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),ms)}
function toggleTema(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('tema',r.dataset.theme)}catch{}}
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch{}
async function api(rota,body){const {data:{session}}=await sb.auth.getSession();const r=await fetch(FN+'/ig-api'+rota,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok||j.erro)throw new Error(j.erro||('HTTP '+r.status));return j}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado. Cola no Instagram.'),()=>toast('Não consegui copiar'))}
function abrirSheet(h,wide){const i=$('#sheetIn');i.className='in'+(wide?' wide':'');i.innerHTML=`<div class="sheet-h"><div class="grow"></div><button class="btn btn-q btn-ic" onclick="fecharSheet()">${ic('x')}</button></div>`+h;$('#sheet').classList.add('on')}
function fecharSheet(){$('#sheet').classList.remove('on')}
const avatar=(foto,nome,cls='')=>`<div class="av ${cls}">${foto?`<img src="${esc(foto)}" loading="lazy" onerror="this.remove()">`:''}${esc((nome||'?')[0].toUpperCase())}</div>`;

// ---------- auth ----------
async function login(){$('#lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#lemail').value.trim(),password:$('#lpass').value});if(error){$('#lerr').textContent='E-mail ou senha inválidos.';return}iniciar()}
async function sair(){await sb.auth.signOut();location.reload()}
$('#lpass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function iniciar(){const {data:{session}}=await sb.auth.getSession();if(!session){$('#login').style.display='grid';$('#app').style.display='none';return}
  S.user=session.user;const {error}=await sb.from('ig_acesso').select('email').limit(1);
  if(error){$('#lerr').textContent='Sem acesso ao Lidera Social. Peça para o admin liberar seu e-mail.';await sb.auth.signOut();return}
  $('#login').style.display='none';$('#app').style.display='block';$('#userLbl').textContent=(S.user.email||'').split('@')[0];
  await carregarContas();renderNav();
  const q=new URLSearchParams(location.search);if(q.get('conectado')){toast('@'+q.get('conectado')+' conectado. Sincronizando…');history.replaceState({},'',location.pathname)}
  realtime();const h=location.hash.replace('#','');aba(TELAS.some(t=>t[0]===h)?h:(S.contas.length?'hoje':'contas'))}
async function carregarContas(){const {data}=await sb.from('ig_contas').select('*').order('conectado_em');S.contas=(data||[]).filter(c=>!String(c.username).startsWith('pendente_'));
  let salva=null;try{salva=localStorage.getItem('conta')}catch{}S.conta=S.contas.find(c=>c.id===salva)||S.contas[0]||null;renderAcct();badges()}
function renderAcct(){const c=S.conta;const h=c?`${avatar(c.foto,c.username)}<div class="grow"><div class="n ell">@${esc(c.username)}</div><div class="s">${fmt(c.seguidores)} seguidores</div></div>${ic('down',16)}`:`<div class="av">+</div><div class="grow"><div class="n">Conectar conta</div><div class="s">nenhuma ainda</div></div>`;$('#acctBtn').innerHTML=h;$('#acctBtnM').innerHTML=c?`${avatar(c.foto,c.username,'sm')}`:'<div class="av sm">+</div>'}
function menuContas(ev){ev.stopPropagation();const host=ev.currentTarget;const ex=host.querySelector('.menu');if(ex){ex.remove();return}
  const m=document.createElement('div');m.className='menu';m.style.minWidth='240px';m.innerHTML=S.contas.map(c=>`<div class="mi ${S.conta&&c.id===S.conta.id?'on':''}" onclick="trocarConta('${c.id}')">${avatar(c.foto,c.username,'sm')}<div class="grow"><div class="sb">@${esc(c.username)}</div><div class="xs mut">${fmt(c.seguidores)} seguidores${c.erro_sync?' · erro no sync':''}</div></div>${S.conta&&c.id===S.conta.id?ic('check',16):''}</div>`).join('')+`<div class="mi" onclick="conectar()">${ic('plus',16)}<span>Conectar outra conta</span></div><div class="mi" onclick="aba('contas')">${ic('contas',16)}<span>Gerenciar contas</span></div><div class="mi" onclick="sair()">${ic('x',16)}<span>Sair</span></div>`;
  host.appendChild(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0)}
function trocarConta(id){S.conta=S.contas.find(c=>c.id===id);try{localStorage.setItem('conta',id)}catch{}S.cache={};renderAcct();badges();aba(S.aba)}
function conectar(){location.href=`${FN}/ig-auth/start?u=${encodeURIComponent(S.user.email)}`}
async function badges(){if(!S.conta){S.badges={};renderNav();return}const cid=S.conta.id;const [a,i,c]=await Promise.all([
  sb.from('ig_acoes').select('id',{count:'exact',head:true}).eq('conta_id',cid).eq('data',hoje()).eq('status','pendente'),
  sb.from('ig_conversas').select('id',{count:'exact',head:true}).eq('conta_id',cid).gt('nao_lidas',0).eq('arquivada',false),
  sb.from('ig_comentarios').select('id',{count:'exact',head:true}).eq('conta_id',cid).eq('de_mim',false).eq('respondido',false).eq('oculto',false).is('parent_id',null)]);
  S.badges={hoje:a.count||0,inbox:i.count||0,coment:c.count||0};renderNav()}
function renderNav(){const b=S.badges||{};const item=(t,n,i,k)=>`<a href="#${t}" class="${S.aba===t?'on':''}" onclick="aba('${t}');return false">${ic(i)}<span>${n}</span>${b[t]?`<span class="badge">${b[t]}</span>`:`<span class="kbd">${k}</span>`}</a>`;
  $('#snav').innerHTML=`<div class="sec">Operação</div>${TELAS.slice(0,4).map(t=>item(...t)).join('')}<div class="sec">Crescimento</div>${TELAS.slice(4,8).map(t=>item(...t)).join('')}<div class="sec">Sistema</div>${TELAS.slice(8).map(t=>item(...t)).join('')}`;
  const bn=[['hoje','Hoje','hoje'],['inbox','Direct','inbox'],['coment','Coment.','coment'],['leads','Leads','leads'],['mais','Mais','more']];
  $('#bnav').innerHTML=bn.map(([t,n,i])=>`<a class="${S.aba===t||(t==='mais'&&!bn.some(x=>x[0]===S.aba))?'on':''}" onclick="${t==='mais'?'menuMais()':`aba('${t}')`}">${ic(i,22)}<span>${n}</span>${b[t]?`<span class="badge">${b[t]}</span>`:''}</a>`).join('')}
function menuMais(){abrirSheet(`<h2 style="margin:0 0 10px">Mais</h2><div class="grid g2">${TELAS.slice(4).map(([t,n,i])=>`<button class="btn btn-s" style="justify-content:flex-start;padding:14px" onclick="fecharSheet();aba('${t}')">${ic(i)}${n}</button>`).join('')}<button class="btn btn-s" style="justify-content:flex-start;padding:14px" onclick="toggleTema()">◐ Tema</button><button class="btn btn-s" style="justify-content:flex-start;padding:14px" onclick="sair()">${ic('x')}Sair</button></div>`)}
function realtime(){sb.channel('ig').on('postgres_changes',{event:'INSERT',schema:'public',table:'ig_mensagens'},p=>{badges();if(!p.new.de_mim)toast('Nova mensagem no direct');if(S.aba==='inbox')renderInbox(true)}).on('postgres_changes',{event:'*',schema:'public',table:'ig_comentarios'},()=>{badges();if(S.aba==='coment')renderComent()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'ig_acoes'},()=>{badges();if(S.aba==='hoje')renderHoje()}).subscribe()}
async function sync(){if(!S.conta)return;const bs=[$('#btnSync'),$('#btnSyncM')];bs.forEach(b=>b.innerHTML='<span class="spin"></span>');try{const r=await api('/sync',{conta_id:S.conta.id});const x=r[S.conta.id];toast(typeof x==='string'?x:`Sync ok: ${x.midias} posts, ${x.comentarios} comentários, ${x.conversas} conversas`);await carregarContas();S.cache={};aba(S.aba)}catch(e){toast('Erro no sync: '+e.message)}$('#btnSync').textContent='↻ Sync';$('#btnSyncM').innerHTML=ic('sync',18)}

// ---------- navegação ----------

function impTab(t){$('#imp_colar').classList.toggle('hide',t!=='colar');$('#imp_arquivo').classList.toggle('hide',t!=='arquivo');document.querySelectorAll('#impTabs button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase().startsWith(t==='colar'?'colar':'arquivo')))}
function extrairUsernames(txt){const out=new Set();const t=String(txt||'');
  try{const j=JSON.parse(t);const arr=Array.isArray(j)?j:(j.relationships_followers||j.followers||[]);arr.forEach(x=>{const v=x.string_list_data?.[0]?.value||x.value||x.username;if(v)out.add(String(v).toLowerCase())});if(out.size)return [...out]}catch{}
  const re=/(?:instagram\.com\/|@)?([a-z0-9](?:[a-z0-9._]{0,28}[a-z0-9])?)(?=[^a-z0-9._]|$)/gi;let m;const lixo=new Set(['instagram','com','www','https','http','seguidores','seguir','seguindo','remover','follow','following','followers','remove','p','reel','reels','stories','explore','accounts','direct','e','a','o','de','do','da']);
  for(const line of t.split(/\r?\n/)){const ln=line.trim();if(!ln)continue;const mm=ln.match(/^@?([a-z0-9][a-z0-9._]{0,29})$/i);if(mm){out.add(mm[1].toLowerCase());continue}
    let mm2=ln.match(/instagram\.com\/([a-z0-9._]{2,30})/ig);if(mm2){mm2.forEach(u=>out.add(u.split('/').pop().toLowerCase()));continue}
    const toks=ln.split(/\s+/);if(toks.length===1||toks[0].startsWith('@')){const u=toks[0].replace(/^@/,'').toLowerCase();if(/^[a-z0-9][a-z0-9._]{1,29}$/.test(u)&&!lixo.has(u))out.add(u)}}
  return [...out].filter(u=>!lixo.has(u)&&u.length>1)}
async function processarImport(){let txt=$('#imp_txt').value;const f=$('#imp_file').files[0];if(f)txt=await f.text();const todos=$('#imp_todos').checked;const users=extrairUsernames(txt);if(!users.length)return toast('Não achei nenhum @ no texto');
  const cid=S.conta.id,d=hoje();toast(`Comparando ${users.length} seguidores…`,8000);
  const {count:base}=await sb.from('ig_seguidores').select('*',{count:'exact',head:true}).eq('conta_id',cid);

let comFiltro='pendentes';
async function renderComent(){const cid=S.conta.id;const {data:cs0}=await sb.from('ig_comentarios').select('*').eq('conta_id',cid).eq('de_mim',false).is('parent_id',null).order('respondido').order('criado_em',{ascending:false}).limit(200);const mids=[...new Set((cs0||[]).map(c=>c.midia_id).filter(Boolean))];const {data:mds}=mids.length?await sb.from('ig_midias').select('id,legenda,thumb,permalink').in('id',mids):{data:[]};const mmap=Object.fromEntries((mds||[]).map(m=>[m.id,m]));const cs=(cs0||[]).map(c=>({...c,ig_midias:mmap[c.midia_id]||null}));
  const pend=cs.filter(c=>!c.respondido&&!c.oculto),resto=cs.filter(c=>c.respondido||c.oculto);const lista=comFiltro==='pendentes'?pend:resto;
  const item=c=>`<div class="card" id="c_${c.id}" style="margin:0"><div class="row" style="align-items:flex-start">${c.ig_midias?.thumb?`<a href="${esc(c.ig_midias.permalink)}" target="_blank"><img src="${esc(c.ig_midias.thumb)}" style="width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--panel-2)"></a>`:`<div class="av">P</div>`}<div class="grow" style="min-width:0"><div class="row"><a class="sb" href="https://www.instagram.com/${esc(c.autor_username)}/" target="_blank">@${esc(c.autor_username)}</a>${c.lead_id?`<span class="pill info">lead</span>`:''}<span class="xs mut right">${rel(c.criado_em)}</span></div><div style="margin:4px 0;font-size:14px">${esc(c.texto)}</div><div class="xs mut ell">em: ${esc((c.ig_midias?.legenda||'').slice(0,100))}</div>
    ${c.respondido?`<div class="sm" style="margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ok-soft);color:var(--ok)">↳ ${esc(c.resposta_texto||'respondido')}</div>`:c.oculto?'<span class="pill" style="margin-top:6px">oculto</span>':`<div id="ia_${c.id}" class="sm t2" style="margin-top:6px"></div><textarea id="r_${c.id}" placeholder="Resposta pública, agregando valor (1 a 2 linhas). Nunca 'top!'." style="min-height:58px;margin-top:6px">${esc(c.sugestao_ia||'')}</textarea>
    <div class="row wrap" style="margin-top:6px"><button class="btn btn-s btn-sm" onclick="sugerirCom('${c.id}')">${ic('spark',14)}IA</button><button class="btn btn-p btn-sm" onclick="responderCom('${c.id}')">${ic('send',14)}Responder</button>${c.lead_id?`<button class="btn btn-q btn-sm" onclick="abrirLead('${c.lead_id}')">${ic('user',14)}Lead</button>`:''}<button class="btn btn-q btn-sm right" onclick="ocultarCom('${c.id}')">Ocultar</button></div>`}</div></div></div>`;

  else{$('#main').innerHTML=top+`<div class="card pad-0" style="overflow:auto"><table><thead><tr><th>@</th><th>Restaurante</th><th>Fluxo</th><th>Etapa</th><th>Faixa</th><th>ICP</th><th>Último toque</th><th>Próximo</th></tr></thead><tbody>${ls.map(l=>`<tr onclick="abrirLead('${l.id}')" style="cursor:pointer"><td class="sb">${esc(l.username)}</td><td>${esc(l.restaurante||'')}<div class="xs mut">${esc(l.cidade||'')}</div></td><td>${l.fluxo}</td><td>${ETAPAS[l.etapa]}</td><td>${FAIXAS[l.faixa]||''}</td><td>${l.icp==='passa'?'<span class="pill ok">passa</span>':l.icp==='nao_passa'?'<span class="pill">não</span>':''}</td><td class="mut">${rel(l.ultimo_toque)}</td><td>${dBR(l.proximo_toque)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum lead</td></tr>'}</tbody></table></div>`}}

function novoLead(){abrirSheet(`<h2 style="margin:0 0 4px">Novo lead</h2><div class="desc sm">A IA lê o perfil (se for profissional), faz a triagem de ICP e já escreve a mensagem de ativação.</div><label>@ do Instagram</label><input id="nl_u" placeholder="username" autofocus><label>Fluxo de origem</label><select id="nl_f">${Object.entries(FLUXOS).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('')}</select><label>Sinal de calor (opcional)</label><input id="nl_s" placeholder="ex.: abriu segunda unidade, está contratando"><div class="row" style="margin-top:16px"><button class="btn btn-s" onclick="fecharSheet()">Cancelar</button><button class="btn btn-g right" onclick="criarLead()">${ic('spark',14)}Pesquisar e criar</button></div>`);setTimeout(()=>$('#nl_u')?.focus(),50)}

  ${msgAtiv?`<label>Mensagem de ativação sugerida</label><div class="acao b4" style="margin:0"><div class="grow"><div class="txt" style="margin:0 0 6px">${esc(msgAtiv.texto)}</div><button class="btn btn-s btn-sm" onclick="copiar(${JSON.stringify(msgAtiv.texto).replace(/"/g,'&quot;')})">${ic('copy',14)}Copiar</button></div></div>`:''}
  <div class="row" style="margin-top:10px"><button class="btn btn-s btn-sm" onclick="repesquisar('${l.id}','${esc(l.username)}','${l.fluxo}')">${ic('spark',14)}Pesquisar de novo</button>${l.conversa_id?`<button class="btn btn-s btn-sm" onclick="fecharSheet();abrirConversa('${l.conversa_id}')">${ic('inbox',14)}Conversa</button>`:''}</div>

  <div><label>WhatsApp</label><input id="ld_wa" value="${esc(l.whatsapp||'')}" inputmode="tel"></div><div><label>Próximo toque</label><input id="ld_prox" type="date" value="${l.proximo_toque||''}"></div></div>

async function salvarLead(id){const v=i=>$('#'+i).value;const upd={nome:v('ld_nome'),restaurante:v('ld_rest'),cidade:v('ld_cid'),segmento:v('ld_seg'),fluxo:v('ld_fluxo'),etapa:v('ld_etapa'),faixa:v('ld_faixa')||null,icp:v('ld_icp'),whatsapp:v('ld_wa'),proximo_toque:v('ld_prox')||null,sinal_calor:v('ld_sinal'),conexao:v('ld_con'),desafio:v('ld_des'),ganho:v('ld_gan'),pesquisa:v('ld_pesq')};

// ===================== MÉTRICAS =====================
let metPeriodo=30;
function chartLine(arr,k,cor,fill=true){const vs=arr.map(x=>Number(x[k])||0);if(vs.length<2)return '<div class="mut sm" style="padding:30px 0;text-align:center">Poucos dias de histórico ainda. O sync diário vai preencher.</div>';const mn=Math.min(...vs),mx=Math.max(...vs),w=600,h=140,pad=8;const pt=(v,i)=>[(i/(vs.length-1))*w,h-pad-((v-mn)/((mx-mn)||1))*(h-pad*3)];const pts=vs.map(pt);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${fill?`<path d="${d} L${w},${h} L0,${h} Z" fill="${cor}" opacity=".08"/>`:''}<path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${cor}"/></svg><div class="row xs mut"><span>${dBR(arr[0].data)}</span><span class="right">${dBR(arr[arr.length-1].data)} · <b class="t2">${fmt(vs[vs.length-1])}</b></span></div>`}
function chartBars(arr,k,cor){const vs=arr.map(x=>Number(x[k])||0);if(!vs.length)return '<div class="mut sm">Sem dados.</div>';const mx=Math.max(...vs,1),w=600,h=140,bw=w/vs.length;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${vs.map((v,i)=>`<rect x="${(i*bw+1).toFixed(1)}" y="${(h-(v/mx)*(h-10)).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${((v/mx)*(h-10)).toFixed(1)}" rx="2" fill="${cor}" opacity="${0.5+0.5*(v/mx)}"/>`).join('')}</svg><div class="row xs mut"><span>${dBR(arr[0].data)}</span><span class="right">${dBR(arr[arr.length-1].data)}</span></div>`}
async function renderMetricas(){const cid=S.conta.id;const dIni=somaDias(hoje(),-metPeriodo);const [{data:snaps},{data:leads},{data:acs},{data:ms}]=await Promise.all([sb.from('ig_snapshots').select('*').eq('conta_id',cid).gte('data',dIni).order('data'),sb.from('ig_leads').select('fluxo,etapa,criado_em,atualizado_em').eq('conta_id',cid),sb.from('ig_acoes').select('tipo,status,data').eq('conta_id',cid).gte('data',dIni),sb.from('ig_midias').select('id,thumb,url,permalink,legenda,publicado_em,curtidas,comentarios,alcance,salvos,compartilhamentos,visualizacoes,interacoes,produto').eq('conta_id',cid).gte('publicado_em',dIni+'T00:00:00').order('publicado_em',{ascending:false})]);
  const soma=(arr,k)=>arr.reduce((a,x)=>a+(Number(x[k])||0),0);const s7=snaps.slice(-7);const d7=s7.length>1?(s7[s7.length-1].seguidores-s7[0].seguidores):null;
  const mes=hoje().slice(0,7);const agendados=leads.filter(l=>['agendado_charles','agendado_guilherme','compareceu','noshow'].includes(l.etapa)&&(l.atualizado_em||'').startsWith(mes)).length;
  const n=e=>leads.filter(l=>Array.isArray(e)?e.includes(l.etapa):l.etapa===e).length;const ATIV=['ativado','rmv','desafio','escada','convite','agendado_charles','agendado_guilherme','compareceu','noshow','frio'],RESP=['rmv','desafio','escada','convite','agendado_charles','agendado_guilherme','compareceu','noshow'];
  const porFluxo=Object.keys(FLUXOS).map(f=>({f,a:leads.filter(l=>l.fluxo===f&&ATIV.includes(l.etapa)).length,r:leads.filter(l=>l.fluxo===f&&RESP.includes(l.etapa)).length,m:METAS.resposta[f]}));
  const funil=[['Ativados',n(ATIV)],['Responderam (RMV)',n(RESP)],['Desafio nomeado',n(RESP.slice(1))],['Escada concluída',n(RESP.slice(2))],['Convite feito',n(RESP.slice(3))],['Agendados',n(RESP.slice(4))],['Compareceram',n('compareceu')]];const fmax=Math.max(funil[0][1],1);
  const eng=soma(ms,'interacoes')||soma(ms,'curtidas')+soma(ms,'comentarios');const reels=ms.filter(m=>m.produto==='REELS');
  const top=[...ms].sort((a,b)=>(b.interacoes||b.curtidas+b.comentarios)-(a.interacoes||a.curtidas+a.comentarios)).slice(0,5);
  $('#main').innerHTML=`<div class="hd"><div class="tabs2">${[7,30,90].map(p=>`<button class="${metPeriodo===p?'on':''}" onclick="metPeriodo=${p};renderMetricas()">${p} dias</button>`).join('')}</div><div class="right"><button class="btn btn-s btn-sm" onclick="exportCSV()">${ic('ext',14)}Exportar CSV</button></div></div>

async function exportCSV(){const cid=S.conta.id;const {data}=await sb.from('ig_snapshots').select('*').eq('conta_id',cid).order('data');const cols=['data','seguidores','novos_seguidores','alcance','visitas_perfil','cliques_site','contas_engajadas'];const csv=[cols.join(';'),...data.map(r=>cols.map(c=>r[c]??'').join(';'))].join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download=`metricas-${S.conta.username}.csv`;a.click()}

async function renderPlanner(){const cid=S.conta.id;const [y,m]=plMes.split('-').map(Number);const ini=new Date(y,m-1,1),fim=new Date(y,m,0);const d0=somaDias(plMes+'-01',-ini.getDay());const d1=somaDias(plMes+'-'+String(fim.getDate()).padStart(2,'0'),6-fim.getDay());
  const [{data:pls},{data:ms}]=await Promise.all([sb.from('ig_planejados').select('*').eq('conta_id',cid).gte('data',d0).lte('data',d1).order('data').order('hora'),sb.from('ig_midias').select('id,publicado_em,categoria,produto,legenda,permalink').eq('conta_id',cid).gte('publicado_em',d0+'T00:00:00').lte('publicado_em',d1+'T23:59:59')]);
  const porDia={};(pls||[]).forEach(p=>(porDia[p.data]=porDia[p.data]||[]).push(p));(ms||[]).forEach(mm=>{const d=new Date(mm.publicado_em).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});(porDia[d]=porDia[d]||[]).push({id:'m:'+mm.id,data:d,tipo:mm.produto==='REELS'?'reel':'post',categoria:mm.categoria,titulo:(mm.legenda||'').slice(0,40)||'publicação',status:'publicado',permalink:mm.permalink})});
  const dias=[];for(let d=d0;d<=d1;d=somaDias(d,1))dias.push(d);const nomeMes=ini.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const prox=(pls||[]).filter(p=>p.data>=hoje()&&p.status!=='publicado').slice(0,6);
  $('#main').innerHTML=`<div class="hd wrap"><button class="btn btn-q btn-ic" onclick="plMes=mesAdd(plMes,-1);renderPlanner()">${ic('arrow',16).replace('m9 18 6-6-6-6','m15 18-6-6 6-6')}</button><h2 style="text-transform:capitalize;min-width:170px;text-align:center">${nomeMes}</h2><button class="btn btn-q btn-ic" onclick="plMes=mesAdd(plMes,1);renderPlanner()">${ic('arrow',16)}</button><button class="btn btn-q btn-sm" onclick="plMes=hoje().slice(0,7);renderPlanner()">Hoje</button><div class="right row wrap"><button class="btn btn-s btn-sm" onclick="semanaCaptura()">${ic('story',14)}Stories de captura da semana</button><button class="btn btn-s btn-sm" onclick="planejarCiclo()">${ic('layers',14)}Planejar ciclo 3×2 com IA</button><button class="btn btn-p btn-sm" onclick="editarPlan(null,hoje())">${ic('plus',14)}Novo</button></div></div>
  <div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dh">${d}</div>`).join('')}${dias.map(d=>{const evs=porDia[d]||[];const off=!d.startsWith(plMes);return `<div class="d ${d===hoje()?'today':''} ${off?'off':''}" onclick="if(event.target===this||event.target.classList.contains('n'))editarPlan(null,'${d}')"><div class="n">${Number(d.slice(8))}</div>${evs.map(e=>`<div class="ev ${e.categoria||''} ${e.status==='publicado'?'publicado':''}" onclick="event.stopPropagation();${e.id.startsWith('m:')?`window.open('${esc(e.permalink)}')`:`editarPlan('${e.id}')`}" title="${esc(e.titulo||'')}">${e.hora?e.hora.slice(0,5)+' ':''}${e.tipo==='reel'?'▶ ':e.tipo==='story'?'◎ ':e.tipo==='carrossel'?'▤ ':''}${esc(e.titulo||'(sem título)')}</div>`).join('')}${evs.length?`<div class="cnt">${evs.length}</div>`:''}</div>`}).join('')}</div>
  <div class="grid g2 g2m1" style="margin-top:14px"><div class="card" style="margin:0"><h3>Próximos</h3>${prox.length?prox.map(p=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="editarPlan('${p.id}')"><span class="sb" style="width:46px">${dBR(p.data)}</span><span class="pill ${['convite','resultado'].includes(p.categoria)?'gold':'info'}" style="font-size:10px">${CATS[p.categoria]||p.tipo}</span><span class="grow ell sm">${esc(p.titulo||'(sem título)')}</span><span class="pill ${p.status==='pronto'?'ok':p.status==='agendado'?'warn':''}" style="font-size:10px">${p.status}</span></div>`).join(''):'<div class="mut sm">Nada planejado. Use "Planejar ciclo 3×2 com IA".</div>'}</div>
  <div class="card" style="margin:0"><h3>Story de captura (seg a sex)</h3><div class="desc">O ativo mais barato do funil. Publique às 08:30 e fique no direct.</div><table style="margin-top:6px">${Object.entries(STORY_CAP).map(([d,[f,t]])=>`<tr><td class="sb" style="width:40px">${['','Seg','Ter','Qua','Qui','Sex'][d]}</td><td><span class="pill" style="font-size:10px">${f}</span></td><td class="sm">${t}</td><td><button class="btn btn-q btn-sm" onclick="copiar(${JSON.stringify(t)})">${ic('copy',12)}</button></td></tr>`).join('')}</table></div></div>`}
function mesAdd(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
async function editarPlan(id,data){let p={data:data||hoje(),tipo:'post',categoria:'',status:'ideia',hora:''};if(id){const {data:x}=await sb.from('ig_planejados').select('*').eq('id',id).single();p=x}

    <label>Legenda</label><textarea id="pl_leg" style="min-height:120px">${esc(p.legenda||'')}</textarea>
    <label>Roteiro (slides / cenas / stories)</label><textarea id="pl_rot" style="min-height:90px">${esc(p.roteiro||'')}</textarea>
    <div class="grid g2" style="gap:0 10px"><div><label>CTA</label><input id="pl_cta" value="${esc(p.cta||'')}"></div><div><label>Hashtags</label><input id="pl_tags" value="${esc(p.hashtags||'')}"></div></div>
    <label>Mídia para publicar pela API (imagem JPG/PNG ou vídeo MP4 para reel)</label><div class="row wrap"><input id="pl_url" value="${esc(p.midia_url||'')}" placeholder="URL pública ou envie um arquivo →" style="flex:1;min-width:200px"><input type="file" id="pl_file" accept="image/*,video/mp4" style="width:auto;padding:6px" onchange="uploadMidia(this)"></div>${p.midia_url?`<img src="${esc(p.midia_url)}" style="max-height:120px;border-radius:10px;margin-top:8px" onerror="this.style.display='none'">`:''}
    <div class="row wrap" style="margin-top:16px">${id?`<button class="btn btn-d btn-sm" onclick="sb.from('ig_planejados').delete().eq('id','${id}').then(()=>{fecharSheet();renderPlanner()})">${ic('trash',14)}Excluir</button>`:''}<button class="btn btn-q btn-sm" onclick="copiar(($('#pl_leg').value+'\\n\\n'+$('#pl_tags').value).trim())">${ic('copy',14)}Copiar legenda</button><div class="right row"><button class="btn btn-s" onclick="salvarPlan('${id||''}')">Salvar</button>${p.status!=='publicado'?`<button class="btn btn-g" onclick="publicarPlan('${id||''}')">${ic('send',14)}Publicar agora</button>`:''}</div></div>`,true)}
function lerPlan(){const v=i=>$('#'+i).value;return {conta_id:S.conta.id,data:v('pl_data'),hora:v('pl_hora')||null,status:v('pl_status'),tipo:v('pl_tipo'),categoria:v('pl_cat')||null,titulo:v('pl_tit'),gancho:v('pl_gan'),legenda:v('pl_leg'),roteiro:v('pl_rot'),cta:v('pl_cta'),hashtags:v('pl_tags'),midia_url:v('pl_url')||null,criado_por:S.user.email}}
async function salvarPlan(id,silencioso){const p=lerPlan();let r;if(id){r=await sb.from('ig_planejados').update(p).eq('id',id).select('id').single()}else{r=await sb.from('ig_planejados').insert(p).select('id').single()}if(r.error){toast(r.error.message);return null}if(!silencioso){toast('Salvo');fecharSheet();if(S.aba==='planner')renderPlanner()}return r.data.id}
async function publicarPlan(id){const p=lerPlan();if(!p.midia_url)return toast('Precisa de uma imagem/vídeo (URL pública ou upload) para publicar pela API.',5000);if(p.tipo==='story')return toast('Stories não podem ser publicados pela API. Copie o roteiro e publique pelo app.',5000);
  if(!confirm(`Publicar agora no @${S.conta.username} como ${p.tipo}?`))return;const pid=await salvarPlan(id,true);if(!pid)return;toast('Publicando no Instagram…',15000);
  try{const leg=(p.legenda+(p.hashtags?'\n\n'+p.hashtags:'')).trim();const r=await api('/publicar',{conta_id:S.conta.id,planejado_id:pid,tipo:p.tipo==='carrossel'?'post':p.tipo,midia_url:p.midia_url,legenda:leg});toast('Publicado! id '+r.media_id);fecharSheet();renderPlanner()}catch(e){toast('Falhou: '+e.message,8000)}}
async function uploadMidia(inp){const f=inp.files[0];if(!f)return;if(f.size>50*1024*1024)return toast('Arquivo acima de 50 MB');toast('Enviando…',8000);const path=`${S.conta.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from('ig-midias').upload(path,f,{contentType:f.type,upsert:false});if(error)return toast('Upload falhou: '+error.message);const {data}=sb.storage.from('ig-midias').getPublicUrl(path);$('#pl_url').value=data.publicUrl;toast('Mídia pronta')}
async function iaNoPlan(){const tipo=$('#pl_tipo').value,cat=$('#pl_cat').value,tema=$('#pl_tit').value||$('#pl_gan').value;if(!tema)return toast('Escreva o título/ideia primeiro');toast('Escrevendo…',8000);try{const r=await api('/ia/conteudo',{conta_id:S.conta.id,modo:tipo,categoria:cat,tema});if(r.titulo&&!$('#pl_tit').value)$('#pl_tit').value=r.titulo;if(r.gancho)$('#pl_gan').value=r.gancho;if(r.legenda)$('#pl_leg').value=r.legenda;if(r.roteiro)$('#pl_rot').value=r.roteiro;if(r.cta)$('#pl_cta').value=r.cta;if(r.hashtags)$('#pl_tags').value=r.hashtags;if($('#pl_status').value==='ideia')$('#pl_status').value='rascunho';toast('Pronto, revise antes de publicar')}catch(e){toast(e.message)}}
async function semanaCaptura(){const d=hoje();const seg=somaDias(d,(1-new Date(d+'T12:00:00').getDay()+7)%7||0);const rows=[];for(let i=1;i<=5;i++){const dia=somaDias(seg,i-1);const [f,t]=STORY_CAP[i];rows.push({conta_id:S.conta.id,data:dia,hora:'08:30',tipo:'story',categoria:'captura',titulo:`Story de captura: ${f}`,roteiro:t,status:'pronto',criado_por:S.user.email})}
  const {data:ex}=await sb.from('ig_planejados').select('data').eq('conta_id',S.conta.id).eq('categoria','captura').gte('data',seg).lte('data',somaDias(seg,4));const falta=rows.filter(r=>!(ex||[]).some(x=>x.data===r.data));if(!falta.length)return toast('A semana já está planejada');await sb.from('ig_planejados').insert(falta);toast(`${falta.length} stories de captura planejados`);renderPlanner()}
async function planejarCiclo(){const tema=prompt('Tema ou foco do ciclo (opcional). Ex.: "precificação do quilo", "folha de pagamento", "delivery sem lucro"')??null;if(tema===null)return;toast('Gerando 6 ideias no motor 3 por 2…',10000);try{const r=await api('/ia/conteudo',{conta_id:S.conta.id,modo:'ideias',tema});const ideias=r.ideias||[];let d=hoje();const rows=ideias.map((i,k)=>({conta_id:S.conta.id,data:somaDias(d,k*2+1),hora:'11:00',tipo:i.formato||'post',categoria:i.categoria,titulo:i.titulo,gancho:i.gancho,legenda:i.resumo,status:'ideia',criado_por:S.user.email}));await sb.from('ig_planejados').insert(rows);toast(`${rows.length} ideias no calendário (a cada 2 dias). Abra cada uma e clique "Escrever com IA".`,6000);renderPlanner()}catch(e){toast(e.message)}}

// ===================== CRIAR COM IA =====================
let crModo='ideias',crCat='',crRes=null;
function renderCriar(){$('#main').innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,380px) 1fr;gap:14px" id="crWrap"><div class="card" style="margin:0;align-self:start"><h3>O que você quer criar?</h3><div class="chips" style="margin:8px 0 4px" id="crModos">${[['ideias','Ideias'],['post','Post'],['carrossel','Carrossel'],['reel','Reel'],['story','Stories'],['reescrever','Reescrever']].map(([k,n])=>`<span class="chip ${crModo===k?'on':''}" onclick="crModo='${k}';renderCriar()">${n}</span>`).join('')}</div>
    <label>Categoria (motor 3 por 2)</label><div class="chips">${[['','Deixa a IA escolher'],...Object.entries(CATS).filter(([k])=>k!=='captura'&&k!=='outro')].map(([k,n])=>`<span class="chip ${crCat===k?'on':''}" onclick="crCat='${k}';document.querySelectorAll('#crWrap .chips')[1].querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${n}</span>`).join('')}</div>
    <label>${crModo==='reescrever'?'Texto para reescrever':crModo==='ideias'?'Tema ou foco (opcional)':'Tema / ideia'}</label><textarea id="cr_tema" style="min-height:${crModo==='reescrever'?160:90}px" placeholder="${crModo==='ideias'?'ex.: precificação do quilo, equipe que não assume, delivery sem lucro':crModo==='reescrever'?'cole o texto':'ex.: o erro de precificar o quilo pelo concorrente'}"></textarea>
    <label>Ajuste de tom (opcional)</label><input id="cr_tom" placeholder="ex.: mais provocador, mais curto, com um número real">
    <button class="btn btn-g" style="width:100%;justify-content:center;margin-top:14px;padding:12px" onclick="gerarConteudo()">${ic('spark',16)}Gerar</button>
    <div class="xs mut" style="margin-top:10px">A IA escreve no tom do Charles, com o playbook e os posts que mais engajaram desta conta como referência. Revise sempre: a conexão com a realidade é o que vende.</div></div>
    <div id="crOut">${crRes?renderCrRes():`<div class="card empty" style="margin:0;min-height:300px;display:grid;place-items:center">${ic('spark',36)}<div><div class="b">Seu estúdio de conteúdo</div><div class="sm">Ideias no ciclo 3 por 2, legendas, carrosséis, roteiros de reel e stories de captura. Tudo vai direto para o Planejador.</div></div></div>`}</div></div>
    <style>@media(max-width:899px){#crWrap{grid-template-columns:1fr}}</style>`}
async function gerarConteudo(){const tema=$('#cr_tema').value.trim();if(crModo!=='ideias'&&!tema)return toast('Escreva o tema');toast('Escrevendo…',12000);try{crRes=await api('/ia/conteudo',{conta_id:S.conta?.id,modo:crModo,categoria:crCat,tema,texto:tema,tom:$('#cr_tom').value});crRes._modo=crModo;$('#crOut').innerHTML=renderCrRes()}catch(e){toast(e.message)}}
function renderCrRes(){const r=crRes;if(r._modo==='ideias')return `<div class="grid g2 g2m1">${(r.ideias||[]).map((i,k)=>`<div class="ideia"><div class="row"><span class="pill ${['convite','resultado'].includes(i.categoria)?'gold':'info'}">${CATS[i.categoria]||i.categoria}</span><span class="pill">${i.formato}</span></div><div class="g">${esc(i.gancho)}</div><div class="sb sm">${esc(i.titulo)}</div><div class="sm t2" style="margin:4px 0 10px">${esc(i.resumo)}</div><div class="row"><button class="btn btn-p btn-sm" onclick="desenvolver(${k})">${ic('edit',14)}Desenvolver</button><button class="btn btn-s btn-sm" onclick="agendarIdeia(${k})">${ic('planner',14)}Planejar</button></div></div>`).join('')}</div>`;
  const campos=[['gancho','Gancho'],['roteiro','Roteiro'],['legenda','Legenda'],['cta','CTA'],['hashtags','Hashtags']].filter(([k])=>r[k]);
  return `<div class="card" style="margin:0"><div class="row"><h3 class="grow">${esc(r.titulo||'Resultado')}</h3><button class="btn btn-s btn-sm" onclick="copiar(${JSON.stringify([r.gancho,r.roteiro,r.legenda,r.cta,r.hashtags].filter(Boolean).join('\n\n')).replace(/"/g,'&quot;')})">${ic('copy',14)}Copiar tudo</button><button class="btn btn-p btn-sm" onclick="agendarRes()">${ic('planner',14)}Enviar ao Planejador</button></div>${campos.map(([k,n])=>`<label>${n}</label><div class="sm" style="white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.55">${esc(r[k])}</div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn btn-s btn-sm" onclick="$('#cr_tom').value='mais curto';gerarConteudo()">Mais curto</button><button class="btn btn-s btn-sm" onclick="$('#cr_tom').value='mais provocador, com um número real do nicho';gerarConteudo()">Mais provocador</button><button class="btn btn-s btn-sm" onclick="$('#cr_tom').value='mais didático, passo a passo';gerarConteudo()">Mais didático</button></div></div>`}
function desenvolver(k){const i=crRes.ideias[k];crModo=i.formato==='story'?'story':i.formato||'post';crCat=i.categoria;renderCriar();$('#cr_tema').value=i.titulo+'. Gancho: '+i.gancho+'. '+i.resumo;gerarConteudo()}
async function agendarIdeia(k){const i=crRes.ideias[k];const {data}=await sb.from('ig_planejados').insert({conta_id:S.conta.id,data:somaDias(hoje(),1),hora:'11:00',tipo:i.formato||'post',categoria:i.categoria,titulo:i.titulo,gancho:i.gancho,legenda:i.resumo,status:'ideia',criado_por:S.user.email}).select('id').single();toast('No planejador para amanhã');if(data)editarPlan(data.id)}
async function agendarRes(){const r=crRes;const {data}=await sb.from('ig_planejados').insert({conta_id:S.conta.id,data:somaDias(hoje(),1),hora:'11:00',tipo:r._modo==='reescrever'?'post':r._modo,categoria:crCat||null,titulo:r.titulo||$('#cr_tema').value.slice(0,80),gancho:r.gancho||'',legenda:r.legenda||'',roteiro:r.roteiro||'',cta:r.cta||'',hashtags:r.hashtags||'',status:'rascunho',criado_por:S.user.email}).select('id').single();toast('Rascunho criado no planejador');if(data)editarPlan(data.id)}

// ===================== PLAYBOOK =====================
let pbTab='metodo';
async function renderPlaybook(){const c=S.conta;const cfg=c?.config||{};const [{data:acs},{data:rs}]=await Promise.all([sb.from('ig_acesso').select('*').order('criado_em'),c?sb.from('ig_respostas').select('*').eq('conta_id',c.id).order('grupo').order('ordem'):{data:[]}]);
  const inicio=cfg.inicio||(c?.conectado_em||'').slice(0,10);const dias=inicio?Math.max(0,Math.round((Date.now()-new Date(inicio).getTime())/864e5)):0;const lim=Math.min(dias<7?10:dias<14?15:dias<60?25:40,cfg.max_dia||80);
  const tabs=`<div class="tabs2" style="margin-bottom:12px">${[['metodo','Método'],['respostas','Respostas rápidas'],['config','Rampa e metas'],['acesso','Equipe']].map(([k,n])=>`<button class="${pbTab===k?'on':''}" onclick="pbTab='${k}';renderPlaybook()">${n}</button>`).join('')}</div>`;
  let body='';
  if(pbTab==='metodo')body=`<div class="grid g2 g2m1"><div class="card" style="margin:0"><h3>Os 6 fluxos de entrada</h3><div class="desc">Do mais quente ao mais frio. O tempo do time começa pelo topo.</div><table style="margin-top:6px">${[['SC','Story de captura','Charles provoca com enquete/quiz/caixinha. Quem responde já declarou a dor.'],['RS','Reação ou resposta em story','Levantou a mão sozinho. Inbound quente, responder em até 5 min.'],['CP','Comentário ou curtida em post','Responde em público agregando valor, depois vai ao direct.'],['NS','Novo seguidor','Triagem de 60 s, reciprocidade e boas-vindas (12 modelos).'],['VS','Visita sincera','Base parada: frios há 60 dias, quem engajou e não foi abordado.'],['OB','Outbound ativo','Aquecimento de 2 dias: D0 segue/curte/reage, D1 comenta com valor, D2 ativa.']].map(f=>`<tr><td class="b" style="width:36px">${f[0]}</td><td><div class="sb">${f[1]}</div><div class="xs mut">${f[2]}</div></td></tr>`).join('')}</table></div>
    <div class="card" style="margin:0"><h3>As 5 camadas da conversa</h3><div class="desc">Nunca pule uma camada.</div><table style="margin-top:6px">${[['0','Reciprocidade','Seguir, curtir 2 posts, reagir a 1 story. Antes de qualquer mensagem.'],['1','Ativação','Saudação + nome, UMA conexão específica, posicionamento em 1 linha, UMA pergunta factual.'],['2','Condução','Reage em 1 linha e pergunta o desafio com 3 alternativas: financeiro, equipe ou operacional.'],['3','Escada','4 degraus: como aparece · há quanto tempo · o custo · o ganho (literal, vira o campo do closer).'],['4','Conversão','Faixa, prova social, convite ao Diagnóstico, dois horários. Nunca "quando você pode".']].map(f=>`<tr><td class="b" style="width:24px">${f[0]}</td><td><div class="sb">${f[1]}</div><div class="xs mut">${f[2]}</div></td></tr>`).join('')}</table></div>
    <div class="card" style="margin:0"><h3>Regras de ouro</h3><div class="grid g2" style="margin-top:6px"><div><div class="sb" style="color:var(--ok)">Sempre</div><ul class="sm t2" style="padding-left:16px;margin:4px 0">${['Nome do lead e do restaurante','1 detalhe verdadeiro e específico','3 a 4 linhas, no máximo','Saudação temporal','Uma pergunta por mensagem, no final','Reciprocidade antes de qualquer mensagem','Registro no LeadForge no mesmo dia','Português do jeito que ele fala'].map(x=>`<li>${x}</li>`).join('')}</ul></div><div><div class="sb" style="color:var(--bad)">Nunca</div><ul class="sm t2" style="padding-left:16px;margin:4px 0">${['Copiar e colar sem trocar o detalhe','Áudio no primeiro contato','Link, PDF ou catálogo antes da RMV','Preço ou formato do programa no direct','Duas perguntas factuais seguidas','Pressupor incompetência','Pedir número antes do degrau 3','Convidar antes do degrau 4','Duas mensagens sem resposta no mesmo dia','Mais de um emoji','Prometer resultado numérico'].map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>
    <div class="card" style="margin:0"><h3>Rotina diária</h3><table style="margin-top:6px">${Object.entries(BLOCOS).map(([k,[h,n]])=>`<tr><td class="sb mut" style="width:50px">${h}</td><td class="sm">${n}</td></tr>`).join('')}</table><div class="xs mut" style="margin-top:6px">Sempre ligado: ver 100% dos stories dos leads em conversa e reagir a 1 story de cada lead quente por semana.</div></div></div>`;
  if(pbTab==='respostas')body=`<div class="card"><div class="row"><div class="grow"><h3>Respostas rápidas</h3><div class="desc">Os ${RESPOSTAS_PADRAO.length} modelos do playbook já vêm prontos no Direct. Aqui você adiciona os seus (prova social real, casos da cidade, variações que funcionaram).</div></div><button class="btn btn-p btn-sm" onclick="editarResposta()">${ic('plus',14)}Nova</button></div>
    ${(rs||[]).length?`<div style="margin-top:10px">${rs.map(r=>`<div class="tpl" onclick="editarResposta('${r.id}')"><div class="row"><span class="pill">${r.grupo}</span><span class="t grow" style="margin:0">${esc(r.titulo)}</span></div><div class="x">${esc(r.texto)}</div></div>`).join('')}</div>`:'<div class="mut sm" style="margin-top:10px">Nenhuma personalizada ainda.</div>'}</div>`;
  if(pbTab==='config')body=c?`<div class="card"><h3>Rampa de volume · @${esc(c.username)}</h3><div class="grid g3" style="gap:0 12px"><div><label>Início da operação</label><input id="cfg_inicio" type="date" value="${inicio}"></div><div><label>Teto por dia</label><input id="cfg_max" type="number" value="${cfg.max_dia||80}"></div><div><label>Story de captura na fila</label><select id="cfg_sc"><option value="" ${!cfg.sem_story_captura?'selected':''}>Sim</option><option value="1" ${cfg.sem_story_captura?'selected':''}>Não</option></select></div></div>
    <div class="sm" style="margin-top:12px">Dia <b>${dias}</b> da operação → limite hoje: <b>${lim} mensagens novas</b>. Semana 1: 10 · semana 2: 15 · semanas 3-4: 25 · a partir do dia 60: 40 · nunca mais de 80. Intervalo de 2 a 3 minutos entre mensagens, nunca duas idênticas no mesmo dia.</div><button class="btn btn-p btn-sm" style="margin-top:12px" onclick="salvarCfg()">Salvar</button></div>
    <div class="card"><h3>Metas do funil</h3><table style="margin-top:6px"><tr><td>Resposta SC</td><td class="b">60–75%</td><td>Resposta RS/CP</td><td class="b">45–60%</td></tr><tr><td>Resposta NS/VS</td><td class="b">25–35%</td><td>Resposta OB</td><td class="b">10–15%</td></tr><tr><td>RMV → desafio</td><td class="b">50%</td><td>Desafio → escada</td><td class="b">60%</td></tr><tr><td>Escada → convite</td><td class="b">55%</td><td>Agendado → compareceu</td><td class="b">70%</td></tr><tr><td>Diagnósticos/mês</td><td class="b">25 a 40</td><td>Roteamento</td><td class="sm">100–300k Guilherme · >300k Charles</td></tr></table></div>`:'<div class="card empty">Conecte uma conta.</div>';
  if(pbTab==='acesso')body=`<div class="card"><h3>Quem acessa</h3><div class="desc">O login é o mesmo do Flow (Supabase Auth). Quem ainda não tem usuário precisa ser criado pelo admin.</div><div class="list" style="margin-top:8px">${(acs||[]).map(a=>`<div class="it" style="cursor:default;padding:8px 0">${avatar(null,a.nome||a.email,'sm')}<div class="grow">${esc(a.nome||'')} <span class="mut sm">${esc(a.email)}</span></div><span class="pill">${a.papel}</span><button class="btn btn-q btn-sm" onclick="removerAcesso('${esc(a.email)}')">${ic('x',14)}</button></div>`).join('')}</div><div class="row wrap" style="margin-top:10px"><input id="ac_email" placeholder="e-mail" style="flex:1;min-width:200px"><input id="ac_nome" placeholder="nome" style="width:140px"><select id="ac_papel" style="width:auto"><option value="sdr">SDR</option><option value="closer">Closer</option><option value="admin">Admin</option></select><button class="btn btn-p btn-sm" onclick="addAcesso()">Liberar</button></div></div>`;
  $('#main').innerHTML=tabs+body}
async function editarResposta(id){let r={grupo:'geral',titulo:'',texto:''};if(id){const {data}=await sb.from('ig_respostas').select('*').eq('id',id).single();r=data}
  abrirSheet(`<h2 style="margin:0 0 6px">${id?'Editar':'Nova'} resposta rápida</h2><label>Grupo</label><select id="rr_g">${['boas_vindas','conducao','escada','conversao','objecao','followup','story','noshow','geral'].map(g=>`<option ${r.grupo===g?'selected':''}>${g}</option>`).join('')}</select><label>Título</label><input id="rr_t" value="${esc(r.titulo)}"><label>Texto (use [Nome] e [restaurante])</label><textarea id="rr_x" style="min-height:140px">${esc(r.texto)}</textarea><div class="row" style="margin-top:14px">${id?`<button class="btn btn-d btn-sm" onclick="sb.from('ig_respostas').delete().eq('id','${id}').then(()=>{fecharSheet();renderPlaybook()})">Excluir</button>`:''}<button class="btn btn-p right" onclick="salvarResposta('${id||''}')">Salvar</button></div>`)}
async function salvarResposta(id){const p={conta_id:S.conta.id,grupo:$('#rr_g').value,titulo:$('#rr_t').value,texto:$('#rr_x').value};if(!p.titulo||!p.texto)return toast('Título e texto');const r=id?await sb.from('ig_respostas').update(p).eq('id',id):await sb.from('ig_respostas').insert(p);if(r.error)return toast(r.error.message);fecharSheet();renderPlaybook()}
async function salvarCfg(){const cfg={...(S.conta.config||{}),inicio:$('#cfg_inicio').value,max_dia:Number($('#cfg_max').value)||80,sem_story_captura:!!$('#cfg_sc').value};await sb.from('ig_contas').update({config:cfg}).eq('id',S.conta.id);S.conta.config=cfg;toast('Salvo');renderPlaybook()}
async function addAcesso(){const email=$('#ac_email').value.trim().toLowerCase();if(!email)return;const {error}=await sb.from('ig_acesso').upsert({email,nome:$('#ac_nome').value,papel:$('#ac_papel').value});toast(error?error.message:'Liberado');renderPlaybook()}
async function removerAcesso(email){if(!confirm('Remover '+email+'?'))return;await sb.from('ig_acesso').delete().eq('email',email);renderPlaybook()}

// ===================== CONTAS =====================
async function renderContas(){
  $('#main').innerHTML=`<div class="card" style="background:linear-gradient(135deg,var(--navy),#2b4a9a);color:#fff;border:0"><div class="row wrap"><div class="grow"><h3 style="color:#fff">Contas do Instagram</h3><div class="sm" style="opacity:.8">Conecte quantas contas profissionais quiser (Business ou Creator) e troque pelo seletor no topo. O login acontece no próprio Instagram.</div></div><button class="btn btn-g" onclick="conectar()">${ic('plus',16)}Conectar conta</button></div></div>
  <div class="grid g2 g2m1" style="margin-top:12px">${S.contas.map(c=>{const venc=c.token_expira?Math.round((new Date(c.token_expira)-Date.now())/864e5):null;return `<div class="card" style="margin:0"><div class="row">${avatar(c.foto,c.username,'lg')}<div class="grow" style="min-width:0"><div class="b ell">@${esc(c.username)}</div><div class="xs mut ell">${esc(c.nome||'')} · ${fmt(c.seguidores)} seguidores · ${fmt(c.midias)} posts</div><div class="xs mut">conectada em ${dBR(c.conectado_em)}</div></div>${S.conta?.id===c.id?'<span class="pill gold">ativa</span>':`<button class="btn btn-s btn-sm" onclick="trocarConta('${c.id}')">Usar</button>`}</div>
    <div class="row wrap" style="margin-top:12px;gap:6px"><span class="pill ${c.webhook_ok?'ok':'hot'}">${c.webhook_ok?'tempo real ok':'tempo real pendente'}</span><span class="pill ${venc!=null&&venc<10?'hot':'ok'}">token ${venc!=null?'vence em '+venc+' d':'?'}</span><span class="pill">sync ${c.ultimo_sync?rel(c.ultimo_sync):'nunca'}</span>${c.erro_sync?`<span class="pill hot" title="${esc(c.erro_sync)}">erro</span>`:''}${!c.ativo?'<span class="pill">inativa</span>':''}${(c.config||{}).robo===false?'<span class="pill">robô off</span>':(c.config||{}).robo_estado?`<span class="pill ${(c.config||{}).robo_pausado_ate&&new Date((c.config||{}).robo_pausado_ate)>new Date()?'warn':'ok'}">robô ${esc(((c.config||{}).robo_estado||{}).status||'')}</span>`:''}</div>
    ${c.erro_sync?`<div class="xs" style="color:var(--bad);margin-top:6px">${esc(c.erro_sync)}</div>`:''}
    <div class="row wrap" style="margin-top:12px"><button class="btn btn-s btn-sm" onclick="S.conta=S.contas.find(x=>x.id==='${c.id}');sync()">${ic('sync',14)}Sincronizar</button><button class="btn btn-s btn-sm" onclick="syncCompleto('${c.id}')">Histórico completo</button><button class="btn btn-q btn-sm" onclick="conectar()">Reconectar</button><button class="btn btn-q btn-sm right" onclick="desativar('${c.id}',${!c.ativo})">${c.ativo?'Desativar':'Ativar'}</button></div></div>`}).join('')||''}</div>
  `}
async function syncCompleto(id){toast('Sync completo iniciado (1 a 2 minutos)…',10000);try{const r=await api('/sync',{conta_id:id,completo:true});toast('Pronto: '+JSON.stringify(r[id]).slice(0,120));await carregarContas();renderContas()}catch(e){toast(e.message)}}
async function desativar(id,ativo){await sb.from('ig_contas').update({ativo}).eq('id',id);await carregarContas();renderContas()}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){$('#login').style.display='grid';$('#app').style.display='none'}});
iniciar();
</script>
</body>
</html>
